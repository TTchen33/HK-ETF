name: Refresh market data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-market-data.yml'
      - 'config/yfinance-symbols.json'
      - 'requirements.txt'
      - 'scripts/ingest-yfinance.py'
  workflow_dispatch:
  schedule:
    # 香港交易日约每 30 分钟更新一次；GitHub Actions 的定时任务使用 UTC。
    - cron: '30 1 * * 1-5'
    - cron: '0,30 2-3 * * 1-5'
    - cron: '0,30 5-7 * * 1-5'
    - cron: '0 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: true

jobs:
  collect-delayed-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install market data collector
        run: pip install -r requirements.txt

      - name: Collect delayed Yahoo Finance market data
        run: python scripts/ingest-yfinance.py

      - name: Save refreshed market data when it changed
        run: |
          git config user.name "hk-etf-explorer-bot"
          git config user.email "hk-etf-explorer-bot@users.noreply.github.com"
          git add data/market-yfinance-latest.json data/market-yfinance-latest.js
          if git diff --cached --quiet; then
            echo "No market data changes to save."
          else
            git commit -m "chore: refresh delayed market data"
            git push
          fi
